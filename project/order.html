<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placement - Mess/Tiffin System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Place Your Order</h2>
        <form action="order.php" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
            
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>
            
            <label for="meal">Meal Type</label>
            <select id="meal" name="meal" required>
                <option value="veg">Vegetarian</option>
                <option value="nonveg">Non-Vegetarian</option>
            </select>
            
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" min="1" required>
            
            <label for="addons">Add-ons (Optional)</label>
            <textarea id="addons" name="addons" placeholder="Extra rice, salad, etc."></textarea>
            
            <label for="address">Delivery Address</label>
            <input type="text" id="address" name="address" required>
            
            <label for="delivery_time">Preferred Delivery Time</label>
            <input type="time" id="delivery_time" name="delivery_time" required>
            
            <label for="payment">Payment Method</label>
            <select id="payment" name="payment" required>
                <option value="cod">Cash on Delivery</option>
                <option value="online">Online Payment</option>
            </select>
            
            <button type="submit">Confirm Order</button>
        </form>
    </div>
</body>
</html>
