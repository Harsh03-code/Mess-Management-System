<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mess/Tiffin Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="login-form">
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <button id="logout-btn" style="display: none; background: #dc3545;">Log Out</button>
    </div>

    <script>
        const API_URL = "http://localhost:5030/auth"; // Backend authentication API

        document.getElementById("login-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            try {
                const res = await axios.post(`${API_URL}/sign-in`, { email, password }, { withCredentials: true });
                if (res.status === 200) {
                    document.getElementById("logout-btn").style.display = "block";
                    alert(res.data.message || "Login successful!");
                    window.location.href = "index.html"; // Redirect to home page
                }
            } catch (error) {
                console.error("Login error:", error.response?.data || error.message);
                alert(error.response?.data?.message || "An error occurred during login.");
            }
        });

        document.getElementById("logout-btn").addEventListener("click", async function() {
            try {
                const res = await axios.post(`${API_URL}/logout`, {}, { withCredentials: true });
                if (res.status === 200) {
                    document.getElementById("logout-btn").style.display = "none";
                }
                alert(res.data.message || "Logged out successfully!");
            } catch (error) {
                console.error("Logout error:", error.response?.data || error.message);
                alert(error.response?.data?.message || "An error occurred during logout.");
            }
        });
    </script>
</body>
</html>
