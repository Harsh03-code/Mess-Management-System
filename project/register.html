<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mess/Tiffin System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <form id="register-form">
            <label for="email">Email</label>
            <input type="email" id="register-email" name="email" placeholder="Enter your email" required>
            
            <label for="password">Password</label>
            <input type="password" id="register-password" name="password" placeholder="Enter your password" required>
            
            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        const API_URL = "http://localhost:5030/auth";

        document.getElementById("register-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            const email = document.getElementById("register-email").value;
            const password = document.getElementById("register-password").value;
            try {
                const res = await axios.post(`${API_URL}/sign-up`, { email, password });
                alert(res.data.message || "Registration successful!");
                window.location.href = "login.html";
            } catch (error) {
                console.error("Registration error:", error.response?.data || error.message);
                alert(error.response?.data?.message || "An error occurred during registration.");
            }
        });
    </script>
</body>
</html>
